# Foundry verb interface - .NET (C#) template. See CONTRACT.md.
# Commands assume `dotnet format` + Roslyn analyzers + NuGetAudit + the built-in
# test runner. Adjust for your solution layout.

[tools]
# mise's .NET support varies by backend; if it can't provide the SDK, use
# actions/setup-dotnet in CI and a local install, and drop this pin.
dotnet = "8.0"

[env]
# habit-hooks (the structural-smell detector) is a pinned, mise-managed pip tool,
# provisioned into a per-plugin venv by setup:habit-hooks (postinstall) whose bin goes on
# PATH below - so the SAME version runs in-loop, pre-push (`gate`) and in CI. The `dotnet`
# sensor OWNS the structural smells (oversized-function, high-complexity, too-many-parameters,
# oversized-file): it wraps `dotnet build` with SonarAnalyzer.CSharp active and ratchets the
# warnings via the snooze baseline; the bundled `generic` sensor adds file-length. Core +
# plugin ship in lockstep, so all pin to this one version (the dotnet plugin depends only on
# core, so generic is pinned explicitly below too). Keep it == the reusable workflow's
# `habit_hooks_version` default.
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "foundry-habit-hooks-dotnet"
# The habit-hooks venv bin on PATH (Linux `bin/`, Windows `Scripts/` - a missing one is
# harmless), plus the repo's scripts/.
_.path = [
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
    "{{config_root}}/scripts",
]

[hooks]
# Provision the pinned habit-hooks on `mise install` (local and CI alike).
postinstall = "mise run setup:habit-hooks"

# Provision the pinned habit-hooks (core + dotnet sensor + generic, same version) into a
# per-plugin venv. Auxiliary - not a contract verb, run via postinstall on `mise install`.
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + dotnet sensor + generic into a venv (structural smells + file-length)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
# generic is pinned explicitly: the dotnet plugin depends only on core, and core's own
# generic dependency is a range that could resolve off the pinned version - the explicit
# pin keeps all three in lockstep.
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION" "habit-hooks-generic==$HABIT_HOOKS_VERSION"
'''

# Structural smells (the dotnet sensor's Sonar warnings + generic file-length, via habit-hooks),
# folded into `lint` below. Same check CI's habits job runs, so `gate` is the same oracle.
# Degrades gracefully (skip) with no .habit-hooks config/snooze or an unresolvable base;
# FAILS only when a config + baseline exist but habit-hooks isn't on PATH (run `mise install`).
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

[tasks.fix]
description = "Auto-format (dotnet format)"
run = "dotnet format"

[tasks.lint]
description = "Format check + structural smells (habit-hooks dotnet sensor)"
# `dotnet format --verify-no-changes` is the style check. `mise run smells` runs habit-hooks:
# the dotnet sensor (SonarAnalyzer structural warnings -> oversized-function, high-complexity,
# too-many-parameters, oversized-file) plus the generic file-length check, RATCHETED against
# the snooze baseline. The sensor owns the structural smells; typecheck (below) owns compile/CA.
run = ["dotnet format --verify-no-changes", "mise run smells"]

[tasks.typecheck]
description = "Build = C#'s compile + analyzer pass"
# TreatWarningsAsErrors turns compiler, built-in CA and NuGetAudit warnings into gate failures.
# The five Sonar structural rules (S104/S107/S138/S1541/S3776) are demoted to `suggestion` in
# .editorconfig, so they do NOT hard-fail here - the dotnet sensor gates them with the ratchet
# instead (run via `mise run smells` in `lint`).
run = "dotnet build -warnaserror"

[tasks.test]
description = "Tests with a 90% line-coverage floor (coverlet.msbuild, configured in the test project)"
run = "dotnet test --no-build"

[tasks.audit]
description = "Dependency vulnerabilities"
# `dotnet list --vulnerable` exits 0 even with findings, so fail explicitly when the report
# names a vulnerable package. But DON'T pipe `dotnet list` straight into a negated grep: if
# `dotnet list` itself errors (no project/solution, restore failure) the phrase is simply
# absent and the negation passes GREEN - a broken audit reporting success. So capture it, fail
# on a non-zero `dotnet list`, THEN grep. NuGetAudit (in the build above) is the other half -
# it warns at restore, and -warnaserror fails that.
run = '''
set -eu
out=$(dotnet list package --vulnerable --include-transitive 2>&1) || { echo "$out"; echo "audit: 'dotnet list' failed"; exit 1; }
echo "$out"
if echo "$out" | grep -q 'has the following vulnerable'; then echo "audit: vulnerable packages found"; exit 1; fi
'''

[tasks.gate]
description = "The oracle. Sequential - mise `depends` runs in parallel with no ordering."
run = ["mise run lint", "mise run typecheck", "mise run test", "mise run audit"]
