name: gate
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Foundry's .NET stack shipped in tag v2, so consume the gate facade like the rest of
# the family instead of a hand-rolled gate. The six verbs come from mise/dotnet.toml
# (format / build -warnaserror / test / vulnerable-package audit); structural smells
# run against the committed .habit-hooks baseline.
jobs:
  gate:
    uses: CMaintz/foundry/.github/workflows/gate.yml@a7ce66217276e6a279be2d3861fa1da7c40cfa76 # v2.11.1
    with:
      stack: dotnet
      working_directory: '.'
