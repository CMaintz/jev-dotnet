name: release
# Publishes CMaintz.Jev.Client to nuget.org when a vX.Y.Z tag is pushed. Auth is NuGet
# trusted publishing (OIDC), so no API key is stored; the policy on nuget.org must name
# this repo and release.yml. NUGET_USER is the nuget.org profile name, not an email.
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '9.0.x'
      - name: Tag must match the csproj version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          actual=$(dotnet msbuild src/Jev.Client -getProperty:Version)
          if [ "v$actual" != "$TAG" ]; then
            echo "::error::$TAG does not match src/Jev.Client version ($actual)"
            exit 1
          fi
      - run: dotnet test -c Release
      - run: dotnet pack src/Jev.Client -c Release -o ./nupkg
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: >-
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
