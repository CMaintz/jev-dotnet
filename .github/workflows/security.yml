name: security
on:
  pull_request: {}
  push:
    branches: [main]
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  security:
    uses: CMaintz/foundry/.github/workflows/security.yml@f5b41d3226140cfdfa7932a36d9c86513b0662cc # v2.6.0
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    with:
      # Gate-defining files: changing these alongside source needs the ruleset-change label.
      ruleset_paths: '^(mise\.toml|Directory\.Build\.props|\.editorconfig|Jev\.sln|\.habit-hooks/|\.jscpd\.json|\.gitleaks\.toml|\.github/workflows/|scripts/)'
      source_paths: '^src/'
      test_paths: '^tests/'
