# The habit-hooks dotnet sensor owns the structural smells (oversized-function,
# high-complexity, too-many-parameters, oversized-file): it builds Jev.sln with
# SonarAnalyzer.CSharp active (referenced only for the sensor's build, see
# ../Directory.Build.props) and ratchets the warnings via the snooze baseline. typecheck
# (`dotnet build -warnaserror`) keeps compile errors, the built-in CA rules and NuGetAudit.
# The generic plugin adds file-length (below) and, opt-in, jscpd.
plugins = ["dotnet", "generic"]

# Tests are not smell-scanned (language-agnostic principle - see README).
files = ["**/*.cs", "!**/tests/**", "!**/bin/**", "!**/obj/**"]

# One solution (Jev.sln); name it so the sensor's `dotnet build` does not rely on MSBuild's
# single-file auto-detection.
[sensors.dotnet-build]
args = ["Jev.sln"]

# File-length: flag files over 300 lines (oversized-file).
[sensors.line-count]
args = ["--max", "300"]

# jscpd is a Node CLI the Foundry .NET smells job doesn't install, so enabling it made the
# job fail as an "incomplete run" on every PR touching C#. Disabled, matching Foundry's
# dotnet preset; to turn duplication detection on, install Node + jscpd in that job first.
[sensors.jscpd]
disabled = true
